<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Camera ANPR Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <header class="topbar">
    <h1>🚦 Multi-Camera Vehicle Tracking</h1>
    <div class="stats" id="statsBar">
      <span id="statVehicles">0 vehicles</span>
      <span id="statCameras">0 cameras</span>
      <span id="statAlerts">0 alerts</span>
    </div>
  </header>

  <section class="upload-panel">
    <h2>Upload Camera Feed</h2>
    <form id="uploadForm">
      <div class="field">
        <label>Video file</label>
        <input type="file" id="videoFile" accept="video/*" required />
      </div>
      <div class="field">
        <label>Camera</label>
        <select id="cameraSelect" required></select>
      </div>
      <div class="field">
        <label>Recording start time</label>
        <input type="datetime-local" id="startTime" required />
      </div>
      <button type="submit" id="uploadBtn">Process Video</button>
    </form>
    <div id="uploadStatus"></div>
  </section>

  <main class="grid">
    <section class="panel map-panel">
      <h2>Live Map</h2>
      <div id="map"></div>
    </section>

    <section class="panel list-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="vehicles">Detected Vehicles</button>
        <button class="tab-btn" data-tab="alerts">Alerts</button>
      </div>

      <div id="tab-vehicles" class="tab-content active">
        <table id="vehicleTable">
          <thead>
            <tr><th>Plate</th><th>Last Seen</th><th>Cameras</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="tab-alerts" class="tab-content">
        <ul id="alertList"></ul>
      </div>
    </section>
  </main>

  <section class="panel trajectory-panel" id="trajectoryPanel" style="display:none;">
    <h2>Vehicle Journey: <span id="trajPlate"></span> <button id="closeTraj">✕</button></h2>
    <div id="trajLegs"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
